services:
  - type: web
    name: barbearia-geslei
    runtime: python
    plan: starter
    buildCommand: "echo 'Sem dependências externas'"
    startCommand: "python reservas_web.py"
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: BARBEARIA_ADMIN_TOKEN
        generateValue: true
    disk:
      name: barbearia-clientes
      mountPath: /var/data
      sizeGB: 1
      